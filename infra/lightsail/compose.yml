services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks: [public, private]
    mem_limit: 96m
    cpus: 0.25

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      APP_ENV: staging
      LOG_LEVEL: info
      ENABLE_DEBUG_TOOLS: "false"
      ALLOW_DEV_AUTH: ${ALLOW_DEV_AUTH:-true}
      DATABASE_URL: ${DATABASE_URL}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      MAX_REQUEST_BODY_BYTES: 1048576
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE}
      AUTH_JWT_REQUIRE_JTI: "true"
      AUTH_LOGIN_CLIENT_RATE_LIMIT_COUNT: 20
      AUTH_LOGIN_CLIENT_RATE_LIMIT_WINDOW_SECONDS: 60
      AUTH_LOGOUT_CLIENT_RATE_LIMIT_COUNT: 60
      AUTH_LOGOUT_CLIENT_RATE_LIMIT_WINDOW_SECONDS: 60
      DEEPSEEK_PARSER_URL: https://api.deepseek.com/v1/chat/completions
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL_ID: ${DEEPSEEK_MODEL_ID:-deepseek-v4-flash}
      LOCAL_LLM_REPAIR_FALLBACK_ENABLED: "false"
      LOCAL_LLM_TIMEOUT_SECONDS: 45
      LOCAL_LLM_MAX_TOKENS: 900
    expose: ["8000"]
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    mem_limit: 384m
    cpus: 1.0

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    user: "70:70"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bloodsugar}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose: ["5432"]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app} -d $${POSTGRES_DB:-bloodsugar}"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 320m
    cpus: 0.75

networks:
  public:
  private:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
